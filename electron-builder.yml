appId: com.androidsup.tapmakerwork
productName: TapMakerWork
copyright: Copyright © 2026 androidsup
afterSign: scripts/notarize.cjs
directories:
  output: outputs/installers
files:
  - apps/desktop/dist/**/*
  - apps/studio/dist/**/*
  - packages/bridge/dist-app/**/*
  - runtime/**/*
  - package.json
asar: true
compression: maximum
electronLanguages:
  - en
  - zh-CN
  - zh-TW
asarUnpack:
  - packages/bridge/dist-app/**/*
extraResources:
  - from: packages/bridge/dist-app
    to: bridge
    filter:
      - index.mjs
# Release upload is handled separately. Declaring the generic Gitee directory
# makes electron-builder emit latest*.yml without attempting to publish during
# local packaging; the app resolves the actual newest release tag at runtime.
publish:
  provider: generic
  url: https://gitee.com/AndroidSUP/tap-maker-work/releases/download/v${version}/
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TapMakerWork
  runAfterFinish: true
  deleteAppDataOnUninstall: false
