events:
  milestone:
    desc: 用户首次到达稳定业务节点（标准里程碑）
    fields:
      milestoneType:
        type: string
        desc: 里程碑类型，如 new_user、global
        required: true
      milestonePoint:
        type: string
        desc: 里程碑节点名称，如启动 IDE、打开项目
        required: true
      elapsedSinceRegistrationMs:
        type: number
        desc: SDK 自动补充，距用户注册的毫秒数
  session_end:
    desc: SDK 自动上报的会话结束
    fields:
      sessionDurationMs:
        type: number
        desc: 本次会话持续毫秒数
  _project_open:
    desc: IDE 成功打开一个 Maker 项目
    fields:
      result:
        type: string
        desc: 打开结果，成功时省略或为 ok
  _project_open_fail:
    desc: IDE 打开项目失败
    fields: {}
  _preview_action:
    desc: Maker 预览 start/stop/refresh
    fields:
      action:
        type: string
        desc: start、stop 或 refresh
        required: true
      result:
        type: string
        desc: ok、fail 等结果
  _build_trigger:
    desc: 触发官方 Maker 远程构建
    fields:
      result:
        type: string
        desc: ok、fail 或 error
        required: true
  _update_check:
    desc: 检查桌面更新
    fields:
      silent:
        type: boolean
        desc: 是否静默检查
  _ide_session:
    desc: 会话结束时的本机使用时长摘要
    fields:
      session_ms:
        type: number
        desc: 会话墙钟毫秒
        required: true
      active_ms:
        type: number
        desc: 窗口活跃毫秒
        required: true
